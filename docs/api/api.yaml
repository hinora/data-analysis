openapi: 3.0.3
info:
  title: Data Analysis Platform API
  description: |
    REST API for the Data Analysis Platform.
    All endpoints are exposed through the API Gateway (microservice.proxy) at `/api`.
  version: 1.0.0

servers:
  - url: http://localhost:3000/api
    description: Local development

tags:
  - name: Health
    description: System health check
  - name: Sessions
    description: Analysis session management
  - name: Conversations
    description: Conversation threads within sessions
  - name: Chat
    description: AI-powered chat messaging
  - name: Upload
    description: File upload, URL import, and web search import for sessions

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time
                  uptime:
                    type: number
                    description: Uptime in seconds

  # ── Sessions ──────────────────────────────────────────────

  /sessions:
    post:
      tags: [Sessions]
      summary: Create a new session
      operationId: createSession
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                  description: Optional session name. Auto-generated if omitted.
      responses:
        "200":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"

    get:
      tags: [Sessions]
      summary: List sessions (paginated)
      operationId: listSessions
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Paginated session list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Session"
                  total:
                    type: integer
                  page:
                    type: integer
                  limit:
                    type: integer
                  totalPages:
                    type: integer

  /sessions/{id}:
    get:
      tags: [Sessions]
      summary: Get a session by ID
      operationId: getSession
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Session details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [Sessions]
      summary: Delete a session
      description: |
        Deletes the session and cascades to conversations and chat messages.
        Emits `sessionData.sessionDeleted` event for cross-service cleanup.
      operationId: deleteSession
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Session deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  id:
                    type: string
                    format: uuid
        "404":
          $ref: "#/components/responses/NotFound"

  /sessions/{id}/rename:
    patch:
      tags: [Sessions]
      summary: Rename a session
      operationId: renameSession
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
      responses:
        "200":
          description: Session renamed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Upload ────────────────────────────────────────────────

  /sessions/{sessionId}/upload:
    post:
      tags: [Upload]
      summary: Upload a file to a session
      description: |
        Handles file upload for a session:
        1. Validates file type and size (max 100MB)
        2. Computes SHA-256 hash and checks for duplicates
        3. Saves original file to disk
        4. Parses file and creates Dataset(s) with DataRecords/TextChunks
        5. Emits metadata.generateMetadata event for metadata generation
        6. Updates session datasetCount
      operationId: uploadFile
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: "File to upload (CSV, PDF, XLSX, XLSM)"
      responses:
        "200":
          description: File uploaded and parsed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  originalFileId:
                    type: string
                    format: uuid
                  datasets:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        name:
                          type: string
                        datasetType:
                          type: string
                          enum: [structured-table, unstructured-text]
                        rowCount:
                          type: integer
                        columnCount:
                          type: integer
                          nullable: true
        "400":
          description: Invalid file type, file too large, or duplicate file
        "404":
          $ref: "#/components/responses/NotFound"

  /sessions/{sessionId}/import-url:
    post:
      tags: [Upload]
      summary: Import data from a URL
      description: |
        Fetches web page content from a URL using headless Chrome (Puppeteer),
        chunks the text semantically, and imports it as an unstructured-text dataset.
        1. Validates URL format and protocol (HTTP/HTTPS only)
        2. Fetches page content via tools.webFetch (Puppeteer)
        3. Computes SHA-256 hash of URL + content for duplicate detection
        4. Creates OriginalFile record (storagePath = URL)
        5. Semantic-chunks the content and stores as TextChunks
        6. Emits metadata.generateMetadata event
        7. Updates session datasetCount
      operationId: importFromUrl
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  format: uri
                  description: "URL of the web page to import"
      responses:
        "200":
          description: URL content imported successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  originalFileId:
                    type: string
                    format: uuid
                  datasets:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        name:
                          type: string
                        datasetType:
                          type: string
                          enum: [unstructured-text]
                        rowCount:
                          type: integer
                        columnCount:
                          type: integer
                          nullable: true
        "400":
          description: Invalid URL, unsupported protocol, or missing sessionId
        "409":
          description: URL has already been imported to this session
        "422":
          description: Failed to fetch URL content or URL returned empty content

  /sessions/{sessionId}/search-websites:
    post:
      tags: [Upload]
      summary: Search websites by keywords
      description: |
        Accepts one or more search keywords, queries the Brave Search API for each,
        and returns a deduplicated list of website results. The user can then
        select which websites to import via the import-url endpoint.
      operationId: searchWebsites
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [keywords]
              properties:
                keywords:
                  type: array
                  items:
                    type: string
                    minLength: 1
                  minItems: 1
                  maxItems: 10
                  description: "Search keywords (max 10)"
                count:
                  type: integer
                  minimum: 1
                  maximum: 20
                  default: 5
                  description: "Number of results per keyword (default: 5, max: 20)"
      responses:
        "200":
          description: Search results returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  keywords:
                    type: array
                    items:
                      type: string
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        title:
                          type: string
                        url:
                          type: string
                          format: uri
                        description:
                          type: string
                        keyword:
                          type: string
                          description: "The keyword that produced this result"
                  totalCount:
                    type: integer
        "400":
          description: Invalid sessionId or missing keywords

  # ── Conversations ─────────────────────────────────────────

  /conversations:
    post:
      tags: [Conversations]
      summary: Create a conversation
      description: |
        Creates a new conversation within a session. Automatically constructs
        a system prompt from the session's datasets and stores it as the first message.
      operationId: createConversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId]
              properties:
                sessionId:
                  type: string
                  format: uuid
                name:
                  type: string
                  minLength: 1
                  maxLength: 500
                  description: Optional name. Auto-generated if omitted.
      responses:
        "200":
          description: Conversation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationFull"
        "404":
          $ref: "#/components/responses/NotFound"

    get:
      tags: [Conversations]
      summary: List conversations for a session
      operationId: listConversations
      parameters:
        - name: sessionId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Conversation list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConversationSummary"

  /conversations/{id}:
    get:
      tags: [Conversations]
      summary: Get a conversation by ID
      operationId: getConversation
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: Conversation details including system prompt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationFull"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [Conversations]
      summary: Delete a conversation
      description: Cascade-deletes all messages and AI logs for this conversation.
      operationId: deleteConversation
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: Conversation deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  id:
                    type: string
                    format: uuid
        "404":
          $ref: "#/components/responses/NotFound"

  /conversations/{id}/rename:
    patch:
      tags: [Conversations]
      summary: Rename a conversation
      operationId: renameConversation
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 500
      responses:
        "200":
          description: Conversation renamed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationFull"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Chat ──────────────────────────────────────────────────

  /chat/messages:
    get:
      tags: [Chat]
      summary: Get conversation message history
      operationId: getChatHistory
      parameters:
        - name: conversationId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: excludeSystem
          in: query
          schema:
            type: boolean
            default: false
          description: Exclude system-role messages from results
      responses:
        "200":
          description: Paginated message history (chronological order)
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      $ref: "#/components/schemas/ChatMessage"
                  total:
                    type: integer
                  page:
                    type: integer
                  limit:
                    type: integer
                  hasMore:
                    type: boolean
        "404":
          $ref: "#/components/responses/NotFound"

    post:
      tags: [Chat]
      summary: Send a message and get AI response (SSE stream)
      description: |
        Saves the user message, runs AI tool-calling orchestration loop
        (up to 10 iterations), and returns a Server-Sent Events stream
        that emits real-time progress events: status updates, reasoning steps,
        tool call activity, content deltas, and a final "done" event with the
        saved assistant message (including confidence, citations, tools used,
        reasoning steps). Also logs to AILog.

        **SSE event types:**
        - `status`  — progress label (e.g. "Building context…")
        - `reasoning` — a single reasoning step string
        - `tool_start` — tool call initiated (name + params)
        - `tool_end` — tool call completed/failed (duration, preview)
        - `content_delta` — streamed assistant text chunk
        - `done` — final saved ChatMessage (stream closes after this)
        - `error` — unrecoverable error (stream closes after this)
      operationId: sendChatMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [conversationId, content]
              properties:
                conversationId:
                  type: string
                  format: uuid
                content:
                  type: string
                  minLength: 1
                  maxLength: 10000
      responses:
        "200":
          description: SSE event stream
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  Newline-delimited SSE frames. Each frame has an `event:` line
                  and a `data:` line containing a JSON object with a `type`
                  field matching the event name.

components:
  parameters:
    SessionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    ConversationId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
              code:
                type: integer
                example: 404

  schemas:
    Session:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum: [empty, has-data, active, archived]
        datasetCount:
          type: integer
        conversationCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ConversationSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        name:
          type: string
        messageCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ConversationFull:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        name:
          type: string
        systemPrompt:
          type: string
        messageCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ChatMessage:
      type: object
      properties:
        id:
          type: string
          format: uuid
        conversationId:
          type: string
          format: uuid
        role:
          type: string
          enum: [system, user, assistant]
        content:
          type: string
        confidenceScore:
          type: number
          format: float
          nullable: true
          description: AI confidence score (0–1)
        citedSources:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/CitedSource"
        toolsUsed:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/ToolUsage"
        reasoningSteps:
          type: array
          nullable: true
          items:
            type: string
        metadata:
          type: object
          nullable: true
          description: Additional structured data attached to the message
          properties:
            chartSpec:
              $ref: "#/components/schemas/ChartSpec"
        createdAt:
          type: string
          format: date-time

    ChartSpec:
      type: object
      description: Specification for rendering a dynamic chart on the frontend
      properties:
        chartType:
          type: string
          enum: [bar, line, pie]
        title:
          type: string
        data:
          type: array
          items:
            type: object
            properties:
              label:
                type: string
              value:
                type: number
            required: [label, value]
        xAxisLabel:
          type: string
          nullable: true
        yAxisLabel:
          type: string
          nullable: true
      required: [chartType, title, data]

    CitedSource:
      type: object
      properties:
        datasetId:
          type: string
          format: uuid
        datasetName:
          type: string
        columnName:
          type: string
          nullable: true

    ToolUsage:
      type: object
      properties:
        toolName:
          type: string
        parameters:
          type: object
        resultSummary:
          type: string
