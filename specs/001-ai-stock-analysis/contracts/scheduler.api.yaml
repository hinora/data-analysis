openapi: 3.0.3
info:
  title: Scheduler API
  description: API for managing daily runs and scheduler operations
  version: 1.0.0

servers:
  - url: /api/v1

tags:
  - name: Runs
    description: Daily run logs and history
  - name: Scheduler
    description: Scheduler status and operations

paths:
  /scheduler/sessions/{sessionId}/run:
    post:
      tags:
        - Runs
      summary: Trigger manual analysis run
      description: Manually trigger all agents to run for this session
      operationId: triggerRun
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '202':
          description: Analysis run started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunStartedResponse'
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Analysis already running for this session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /scheduler/sessions/{sessionId}/runs:
    get:
      tags:
        - Runs
      summary: List daily runs
      description: Returns the history of daily runs for a session
      operationId: listRuns
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - name: status
          in: query
          description: Filter by run status
          schema:
            $ref: '#/components/schemas/RunStatus'
        - name: startDate
          in: query
          description: Start date for run history
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          description: End date for run history
          schema:
            type: string
            format: date
        - name: limit
          in: query
          description: Maximum number of runs
          schema:
            type: integer
            default: 30
            maximum: 100
        - name: offset
          in: query
          description: Offset for pagination
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of daily runs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunsListResponse'
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /scheduler/runs/{runId}:
    get:
      tags:
        - Runs
      summary: Get specific run
      description: Returns details of a specific daily run
      operationId: getRun
      parameters:
        - name: runId
          in: path
          required: true
          description: Run ID
          schema:
            type: string
            format: objectid
      responses:
        '200':
          description: Daily run details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyRunLog'
        '404':
          description: Run not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /scheduler/status:
    get:
      tags:
        - Scheduler
      summary: Get scheduler status
      description: Returns the current status of the scheduler service
      operationId: getSchedulerStatus
      responses:
        '200':
          description: Scheduler status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerStatus'

components:
  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      description: Session ID
      schema:
        type: string
        format: objectid

  schemas:
    RunStatus:
      type: string
      enum:
        - pending
        - running
        - completed
        - failed
        - timeout
        - skipped

    TriggerType:
      type: string
      enum:
        - scheduled
        - manual

    AgentType:
      type: string
      enum:
        - historical
        - news
        - prediction

    AgentLog:
      type: object
      properties:
        agent:
          $ref: '#/components/schemas/AgentType'
        status:
          type: string
          enum: [pending, running, completed, failed, skipped]
        startedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        duration:
          type: integer
          description: Duration in milliseconds
          nullable: true
        itemsProcessed:
          type: integer
          nullable: true
        error:
          type: string
          nullable: true

    DailyRunLog:
      type: object
      properties:
        id:
          type: string
          format: objectid
        sessionId:
          type: string
          format: objectid
        runDate:
          type: string
          format: date
        triggeredBy:
          $ref: '#/components/schemas/TriggerType'
        status:
          $ref: '#/components/schemas/RunStatus'
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
        duration:
          type: integer
          description: Total duration in milliseconds
          nullable: true
        agents:
          type: array
          items:
            $ref: '#/components/schemas/AgentLog'
        newDataCollected:
          type: object
          properties:
            historicalDataPoints:
              type: integer
            newsItems:
              type: integer
        skipReason:
          type: string
          nullable: true
        error:
          type: string
          nullable: true
        timeoutAt:
          type: string
          format: date-time
          description: When this run will timeout if still running
        timeoutReason:
          type: string
          nullable: true
          description: Error message if run timed out

    RunsListResponse:
      type: object
      properties:
        sessionId:
          type: string
          format: objectid
        runs:
          type: array
          items:
            $ref: '#/components/schemas/DailyRunLog'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    RunStats:
      type: object
      properties:
        sessionId:
          type: string
          format: objectid
        period:
          type: object
          properties:
            start:
              type: string
              format: date
            end:
              type: string
              format: date
            days:
              type: integer
        totalRuns:
          type: integer
        successfulRuns:
          type: integer
        failedRuns:
          type: integer
        skippedRuns:
          type: integer
        successRate:
          type: number
          description: Success rate as percentage
        averageDuration:
          type: integer
          description: Average duration in milliseconds
        dataCollected:
          type: object
          properties:
            totalHistoricalDataPoints:
              type: integer
            totalNewsItems:
              type: integer
        agentStats:
          type: array
          items:
            type: object
            properties:
              agent:
                $ref: '#/components/schemas/AgentType'
              successCount:
                type: integer
              failureCount:
                type: integer
              averageDuration:
                type: integer

    SchedulerStatus:
      type: object
      properties:
        running:
          type: boolean
        startedAt:
          type: string
          format: date-time
          nullable: true
        uptime:
          type: integer
          description: Uptime in seconds
        activeJobs:
          type: integer
        pendingJobs:
          type: integer
        completedJobsToday:
          type: integer
        failedJobsToday:
          type: integer

    ScheduledJob:
      type: object
      properties:
        id:
          type: string
          format: objectid
        sessionId:
          type: string
          format: objectid
        stockSymbol:
          type: string
        type:
          type: string
          enum: [daily_analysis]
        nextRunAt:
          type: string
          format: date-time
        lastRunAt:
          type: string
          format: date-time
          nullable: true
        lastRunStatus:
          $ref: '#/components/schemas/RunStatus'
        schedule:
          type: object
          properties:
            time:
              type: string
              pattern: '^([01]?[0-9]|2[0-3]):[0-5][0-9]$'
            timezone:
              type: string
        enabled:
          type: boolean
        createdAt:
          type: string
          format: date-time

    JobsListResponse:
      type: object
      properties:
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/ScheduledJob'
        total:
          type: integer

    SchedulerHealth:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
        components:
          type: object
          properties:
            database:
              type: object
              properties:
                status:
                  type: string
                  enum: [healthy, unhealthy]
                latency:
                  type: integer
                  description: Latency in milliseconds
            jobProcessor:
              type: object
              properties:
                status:
                  type: string
                  enum: [running, stopped]
                activeWorkers:
                  type: integer
            aiProvider:
              type: object
              properties:
                status:
                  type: string
                  enum: [available, unavailable]
                provider:
                  type: string
        lastCheck:
          type: string
          format: date-time

    RunStartedResponse:
      type: object
      properties:
        runId:
          type: string
          format: objectid
        sessionId:
          type: string
          format: objectid
        status:
          type: string
          enum: [pending, running]
        startedAt:
          type: string
          format: date-time
        message:
          type: string
      required:
        - runId
        - sessionId
        - status
        - startedAt

    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
